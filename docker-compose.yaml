version: "3"

services:
  keycloak-mysql:
    image: mysql:8
    container_name: keycloak-mysql
    volumes:
      - keycloak-db-vol:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password
  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: keycloak-mysql
  keycloak-server:
    image: keycloak/keycloak:26.6.3
    container_name: keycloak
    volumes:
      - .:/opt/keycloak/data/import 
    ports:
      - "8181:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: mysql
      KC_DB_URL_HOST: keycloak-mysql
      KC_DB_URL_PORT: 3306
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
    command: "start-dev"
    depends_on:
      - keycloak-mysql
  docs-mongodb:
    image: mongo:8.0.0
    container_name: docs-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - docs-mongo-vol:/data/db
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express-ui
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: user
      ME_CONFIG_BASICAUTH_PASSWORD: user
      ME_CONFIG_MONGODB_SERVER: docs-mongodb
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
    depends_on:
      - docs-mongodb
  spicedb:
    image: authzed/spicedb:v1.53.0
    container_name: spicedb
    ports:
      - "50051:50051"
      - "50052:50052"
      - "9090:9090"
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: preshared-key
      SPICEDB_HTTP_ENABLED: "true"
      SPICEDB_DASHBOARD_ENABLED: "true"
      SPICEDB_LOG_FORMAT: console
      SPICEDB_GRPC_LOG_LEVEL: info
    command: serve
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:50051"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
volumes:
  keycloak-db-vol:
  keycloak-server-vol:
  docs-mongo-vol:
