services:
  keycloak-mysql:
    image: mysql:8
    container_name: keycloak-mysql
    volumes:
      - keycloak-db-vol:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password
  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: keycloak-mysql
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: keycloak
    ports:
      - "8181:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: mysql
      KC_DB_URL_HOST: keycloak-mysql
      KC_DB_URL_PORT: 3306
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          set -e
          exec 3<>/dev/tcp/localhost/9000
          echo -e 'GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          timeout 2 | grep -E '"status"[[:space:]]*:[[:space:]]*"UP"' <&3 
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    command: "start-dev"
    depends_on:
      - keycloak-mysql
  mongo:
    image: mongo:8.0.0
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo-vol:/data/db
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express-ui
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: user
      ME_CONFIG_BASICAUTH_PASSWORD: user
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
    depends_on:
      - mongo
  spicedb:
    image: authzed/spicedb:v1.54.0
    container_name: spicedb
    ports:
      - "50051:50051"
      - "50052:50052"
      - "9090:9090"
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: preshared-key
      SPICEDB_HTTP_ENABLED: "true"
      SPICEDB_DASHBOARD_ENABLED: "true"
      SPICEDB_LOG_FORMAT: console
      SPICEDB_GRPC_LOG_LEVEL: info
    command: serve
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:50051"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  spicedb-schema-writer:
    image: authzed/zed:v1.1.1
    container_name: spicedb-schema-writer
    volumes:
      - ./schema.zed:/workspace/schema.zed
    environment:
      ZED_ENDPOINT: spicedb:50051
      ZED_TOKEN: preshared-key
      ZED_INSECURE: "true"
    command: schema write /workspace/schema.zed
    depends_on:
      - spicedb

volumes:
  keycloak-db-vol:
  mongo-vol:
